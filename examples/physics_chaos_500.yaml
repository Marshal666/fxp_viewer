# Cargo-yard collapse: 500 moving bodies (250 cubes, 150 spheres, 100 tetrahedra).
# Seven static arena bodies are additional: floor, four rails and two launch ramps.
# Open and press Play. Reset reproduces the same spill and impacts.
# Blue balls hit leaning crate stacks; purple convex debris drops into the crush.
version: 1
background:
  type: skybox
  sky_color: [48, 75, 110]
  horizon_color: [170, 188, 199]
  ground_color: [40, 47, 56]
camera:
  position: [25, 21, 29]
  target: [0, 0.5, 0]
  fov: 55
  speed: 12
physics:
  tick_hz: 20
  substeps: 4
  velocity_iterations: 12
  gravity: [0, -9.81, 0]
  seed: 2026
ambient:
  color: [205, 220, 245]
  intensity: 0.35
meshes:
  crate: { primitive: cube }
  ball: { primitive: sphere }
  tetrahedron: { file: assets/tetrahedron.obj }
objects:
  - id: sun
    light:
      type: directional
      direction: [-1, -2, -0.8]
      color: [255, 237, 210]
      intensity: 1.15
  # A shallow loading yard keeps the rolling debris in view.
  - id: yard_floor
    mesh: crate
    color: [72, 84, 94]
    transform:
      position: [0.000, -0.500, 0.000]
      rotation: [0.000, 0.000, 0.000]
      scale: [28.000, 1.000, 28.000]
    physics:
      type: static
      material: { static_friction: 0.700, dynamic_friction: 0.500, restitution: 0.080 }
