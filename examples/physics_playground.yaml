# Open this scene and press Play. Reset restores both demonstrations.
version: 1
background:
  type: skybox
  sky_color: [48, 83, 120]
  horizon_color: [160, 183, 199]
  ground_color: [35, 43, 52]
camera:
  position: [18, 12, 22]
  target: [0, 2, 1]
  fov: 55
physics:
  tick_hz: 60
  substeps: 4
  velocity_iterations: 12
  gravity: [0, -9.81, 0]
  seed: 1234
ambient:
  color: [210, 225, 255]
  intensity: 0.25
meshes:
  cube: { primitive: cube }
  ball: { primitive: sphere }
objects:
  - id: sun
    light:
      type: directional
      direction: [-1, -2, -1]
      color: [255, 239, 215]
      intensity: 1.1
  - id: ground
    mesh: cube
    color: [79, 94, 104]
    transform:
      position: [0, -0.5, 0]
      scale: [30, 1, 26]
    physics:
      type: static
      collider: { shape: box, half_extents: [15, 0.5, 13] }
      material: { static_friction: 0.7, dynamic_friction: 0.5 }
